<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Locks by Danna | Luxury Hair Accessories</title>
    <script>
      // Redefine window.fetch to make it writable and configurable.
      // This prevents runtime TypeError crashes from browser extensions or iframe sandboxes
      // that attempt to assign or wrap window.fetch when it is read-only.
      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return originalFetch;
            },
            set: function(val) {
              originalFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Could not patch window.fetch:", e);
        }
      })();
    </script>
